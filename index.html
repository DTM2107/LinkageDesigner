<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linkage sketcher</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--mut:#6b6a64;--card:#fff;--line:#e3e1d9;--acc:#1f6feb;--bar:#3b4a5a;--jaw:#d9a07f;--jawd:#8a4f30;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#17181a;--fg:#ececea;--mut:#9a9a94;--card:#222427;--line:#35383c;--acc:#6aa5ff;--bar:#9db3c9;--jaw:#b87555;--jawd:#e0a888;--bad:#ff7a6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#17181a;--fg:#ececea;--mut:#9a9a94;--card:#222427;--line:#35383c;--acc:#6aa5ff;--bar:#9db3c9;--jaw:#b87555;--jawd:#e0a888;--bad:#ff7a6b}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
main{max-width:1000px;margin:0 auto;padding:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
button,input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sep{width:1px;height:22px;background:var(--line)}
.wrap{display:flex;gap:10px;flex-wrap:wrap}
.cv{flex:1 1 520px;min-width:0}canvas{width:100%;height:540px;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;touch-action:none}
#st{color:var(--mut);margin-top:6px;min-height:18px}
.pn{flex:0 0 230px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;align-self:flex-start}
.pn h3{margin:0 0 8px;font-size:15px}.pn label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.pn input[type=number]{width:90px}.pn p{color:var(--mut);margin:6px 0}.bad{color:var(--bad)}
.tab{display:flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tab button{width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.tab svg{width:36px;height:36px;fill:none;stroke:var(--acc);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.tab svg .h{fill:var(--card);stroke:var(--fg);stroke-width:1.5}
.tab button.on svg{stroke:#fff}
.ib{width:44px;height:44px;padding:0;border:0;background:none;border-radius:50%}
.ib svg{width:44px;height:44px;display:block}
.ib circle{fill:var(--acc)}.ib path,.ib rect{fill:#fff}.ib:hover{filter:brightness(1.12)}
button:disabled{opacity:.35;cursor:default}.tb{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}.tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><main>
<div class="bar">
<div class="tab">
<button data-t="sel" class="on" title="Select and move"><svg viewBox="0 0 44 44"><path d="M13 7v26l6-6 4 9 5-2-4-9h9z" style="fill:var(--card)"/></svg></button>
<button data-t="line" title="Line"><svg viewBox="0 0 44 44"><path d="M8 36L36 8"/><rect class="h" x="4" y="32" width="8" height="8"/><rect class="h" x="32" y="4" width="8" height="8"/></svg></button>
<button data-t="circ" title="Circle"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="14"/><rect class="h" x="18" y="18" width="8" height="8"/><rect class="h" x="28" y="8" width="7" height="7"/></svg></button>
<button data-t="rect" title="Rectangle"><svg viewBox="0 0 44 44"><rect x="7" y="12" width="30" height="20"/><rect class="h" x="3" y="8" width="8" height="8"/><rect class="h" x="33" y="28" width="8" height="8"/></svg></button>
<button data-t="poly" title="Polygon"><svg viewBox="0 0 44 44"><path d="M22 5l15 8.5v17L22 39 7 30.5v-17z"/><rect class="h" x="18" y="18" width="8" height="8"/></svg></button>
</div>
<span class="sep"></span><button id="un" class="tb" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button id="re" class="tb" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button><span class="sep"></span><button id="pl" class="ib"></button><label><input type="checkbox" id="sn" checked> Snap 1</label><label><input type="checkbox" id="sN" checked> Names</label><label><input type="checkbox" id="sL" checked> Lengths</label>
<span class="sep"></span><button id="ex">Rock crusher example</button><button id="cl">Clear</button>
<span class="sep"></span><button id="sv">Save file</button><button id="opb">Open file</button><input type="file" id="op" accept=".json,application/json" hidden>
<span class="sep"></span><input type="number" id="rs" value="10" min="1" max="120" style="width:60px" title="Video length in seconds"> s <button id="rc" class="ib"></button>
<label style="cursor:pointer">Background picture <input type="file" id="bgf" accept="image/*" style="max-width:150px"></label>
</div>
<div class="wrap"><div class="cv"><canvas id="cv"></canvas><div id="st"></div></div>
<div class="pn" id="pp"></div></div>
</main>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
let pts=[],bars=[],circs=[],blks=[],sel=null,sels=[],angs=[],tool='sel',Z=5,ox=300,oy=70,play=true,st=null,poly=[],ms={x:0,y:0},bg=null,last=0;
const dd=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const addP=(x,y,f)=>{const p={x,y,f:!!f,nm:nxt(pts)};pts.push(p);return p};
const D2=180/Math.PI;
function angH(b){let a=Math.atan2(b.b.y-b.a.y,b.b.x-b.a.x)*D2;if(a>90)a-=180;if(a<=-90)a+=180;return a}
function shr(b1,b2){return [b1.a,b1.b].find(p=>p===b2.a||p===b2.b)}
function angB(b1,b2){const s=shr(b1,b2);let u,v;
if(s){const o1=b1.a===s?b1.b:b1.a,o2=b2.a===s?b2.b:b2.a;u=[o1.x-s.x,o1.y-s.y];v=[o2.x-s.x,o2.y-s.y]}
else{u=[b1.b.x-b1.a.x,b1.b.y-b1.a.y];v=[b2.b.x-b2.a.x,b2.b.y-b2.a.y]}
let a=Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)||1))))*D2;
if(!s&&a>90)a=180-a;return a}
function vtx(b){const dg=p=>bars.filter(x=>x.a===p||x.b===p).length;return dg(b.b)>dg(b.a)?b.b:b.a}
function pinA(one){let m=null;
if(one&&sel&&sel.t==='bar')m={a:sel.o,b:null};
else if(!one&&sels.length===2&&sels.every(s=>s.t==='bar')){if(!shr(sels[0].o,sels[1].o)){$('st').textContent='Pick two lines that share a point to pin an angle.';return}m={a:sels[0].o,b:sels[1].o}}
if(m){snap();angs.push(m)}}
function nxt(arr){const u=new Set(arr.map(p=>p.nm));for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ')if(!u.has(c))return c;let i=1;while(u.has('P'+i))i++;return 'P'+i}
const addB=(a,b,h)=>{const o={a,b,L:dd(a,b),h:!!h,mo:false,w:40,nm:''};bars.push(o);return o};
const addK=ps=>{blks.push({p:ps});ps.forEach((a,i)=>ps.forEach((b,j)=>{if(j<=i||bars.some(o=>(o.a===a&&o.b===b)||(o.a===b&&o.b===a)))return;addB(a,b,!(j===i+1||(i===0&&j===ps.length-1)))}))};
function gpts(){const S=new Set();sels.forEach(s=>{const o=s.o;if(s.t==='pt')S.add(o);else if(s.t==='bar'){S.add(o.a);S.add(o.b)}else if(s.t==='circ')S.add(o.c);else o.p.forEach(p=>S.add(p))});return[...S]}
function boxSel(s){const x0=Math.min(s.x0,s.x1),x1=Math.max(s.x0,s.x1),y0=Math.min(s.y0,s.y1),y1=Math.max(s.y0,s.y1),I=p=>p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1;
if(x1-x0<3/Z&&y1-y0<3/Z){props();return}
if(!s.add)sels=[];const ad=(t,o)=>{if(!sels.some(q=>q.o===o))sels.push({t,o})};pts.filter(I).forEach(p=>ad('pt',p));
bars.forEach(b=>{if(!b.h&&I(b.a)&&I(b.b))ad('bar',b)});
circs.forEach(c=>{if(I(c.c))ad('circ',c)});
blks.forEach(k=>{if(k.p.every(I))ad('blk',k)});
sel=null;props()}
function clean(){angs=angs.filter(m=>bars.includes(m.a)&&(!m.b||bars.includes(m.b)));const u=new Set();bars.forEach(b=>{u.add(b.a);u.add(b.b)});circs.forEach(c=>u.add(c.c));blks.forEach(k=>k.p.forEach(p=>u.add(p)));pts=pts.filter(p=>u.has(p))}
function del(){if(sel||sels.length)snap();if(sels.length){const L=sels.slice();sels=[];L.forEach(s=>{sel=s;del1()});sel=null;clean();props();return}del1()}
function del1(){if(!sel)return;const o=sel.o,inK=(k,b)=>k.p.includes(b.a)&&k.p.includes(b.b);
if(sel.t==='pt'){bars=bars.filter(b=>b.a!==o&&b.b!==o);circs=circs.filter(c=>c.c!==o);const g=blks.filter(k=>k.p.includes(o));blks=blks.filter(k=>!g.includes(k));bars=bars.filter(b=>!g.some(k=>inK(k,b)))}
else if(sel.t==='bar')bars=bars.filter(b=>b!==o);
else if(sel.t==='circ')circs=circs.filter(c=>c!==o);
else{blks=blks.filter(k=>k!==o);bars=bars.filter(b=>!inK(o,b))}
clean();sel=null;props()}
function example(){pts=[];bars=[];circs=[];blks=[];sel=null;sels=[];const P=addP;
const O=P(0,0,1),F=P(28,-62,1),A=P(-22,-29,1),B=P(10,0),D=P(3.5,-53.5),E=P(-21,-62.5),U=P(-32,-41.2),T=P(-31,-68);
[[O,'O'],[F,'F'],[A,'A'],[B,'B'],[D,'D'],[E,'E'],[U,'U'],[T,'T']].forEach(([p,n])=>p.nm=n);
const cr=addB(O,B);addB(B,D);addB(D,F);addB(D,E);addK([A,U,T,E]);
cr.mo=true;cr.pv=O;cr.tp=B;cr.ang=0;cr.w=-40;T.tr=true;
addK([P(-50,-25,1),P(-34,-25,1),P(-34,-80,1),P(-50,-80,1)]);
Z=5;ox=cv.clientWidth*.55;oy=60;props()}
const W=e=>({x:(e.offsetX-ox)/Z,y:(oy-e.offsetY)/Z});
const near=(x,y)=>pts.find(p=>Math.hypot(p.x-x,p.y-y)<9/Z);
const gs=v=>$('sn').checked?Math.round(v):v;
function segD(w,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1e-9,t=Math.max(0,Math.min(1,((w.x-a.x)*dx+(w.y-a.y)*dy)/l));return Math.hypot(w.x-a.x-t*dx,w.y-a.y-t*dy)}
function inPoly(w,ps){let c=false;for(let i=0,j=ps.length-1;i<ps.length;j=i++){const a=ps[i],b=ps[j];if((a.y>w.y)!==(b.y>w.y)&&w.x<(b.x-a.x)*(w.y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function hit(w){const t=9/Z;
for(const p of pts)if(Math.hypot(p.x-w.x,p.y-w.y)<t)return{t:'pt',o:p};
for(const b of bars)if(!b.h&&segD(w,b.a,b.b)<t*.8)return{t:'bar',o:b};
for(const c of circs)if(Math.abs(dd(c.c,w)-c.r)<t)return{t:'circ',o:c};
for(const k of blks)if(inPoly(w,k.p))return{t:'blk',o:k};
for(const c of circs)if(dd(c.c,w)<c.r)return{t:'circ',o:c}}
function solve(held){for(let k=0;k<60;k++)for(const b of bars){const A=b.a,B=b.b,dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1e-9,e=(d-b.L)/d,
wa=(A.f||held.has(A))?0:1,wb=(B.f||held.has(B))?0:1,s=wa+wb;if(!s)continue;
A.x+=dx*e*wa/s;A.y+=dy*e*wa/s;B.x-=dx*e*wb/s;B.y-=dy*e*wb/s}}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);if(e.button===2||e.button===1){st={k:'pan',x:e.offsetX,y:e.offsetY};return}const w=W(e);ms=w;
if(tool==='sel'){const h=hit(w);if(e.ctrlKey||e.metaKey||e.shiftKey){if(sel){sels=[sel];sel=null}if(h){const i=sels.findIndex(s=>s.o===h.o);if(i>=0)sels.splice(i,1);else sels.push(h);if(sels.length===1){sel=sels[0];sels=[]}props();return}st={k:'box',add:true,x0:w.x,y0:w.y,x1:w.x,y1:w.y};return}if(h&&sels.some(s=>s.o===h.o)){st={k:'drag',group:true,l:w,held:new Set()};return}
sels=[];if(h){sel=h;st={k:'drag',h,l:w,held:new Set()}}else{sel=null;st={k:'box',x0:w.x,y0:w.y,x1:w.x,y1:w.y}}props();return}
if(tool==='poly'){const f=poly[0];if(poly.length>2&&f&&Math.hypot(f.x-w.x,f.y-w.y)<9/Z){endPoly();return}
const p=near(w.x,w.y)||{x:gs(w.x),y:gs(w.y),f:false,n:1};poly.push(p);return}
const s=near(w.x,w.y);st={k:tool,s:s,x:s?s.x:gs(w.x),y:s?s.y:gs(w.y)}};
cv.onpointermove=e=>{const w=W(e);ms=w;$('st').textContent=`x ${w.x.toFixed(1)}  y ${w.y.toFixed(1)}`;if(!st)return;
if(st.k==='pan'){ox+=e.offsetX-st.x;oy+=e.offsetY-st.y;st.x=e.offsetX;st.y=e.offsetY}
else if(st.k==='box'){st.x1=w.x;st.y1=w.y}else if(st.k==='drag'){const h=st.h,dx=w.x-st.l.x,dy=w.y-st.l.y;if(!st.sn){snap();st.sn=1}st.l=w;st.held=new Set();
const mv=ps=>ps.forEach(p=>{if(!p.f){p.x+=dx;p.y+=dy}st.held.add(p)});
if(st.group)mv(gpts());else if(h.t==='pt'){h.o.x=w.x;h.o.y=w.y;st.held.add(h.o)}else if(h.t==='bar')mv([h.o.a,h.o.b]);else if(h.t==='circ')mv([h.o.c]);else mv(h.o.p)}};
cv.onpointerup=e=>{const w=W(e);if(!st)return;const s=st;st=null;if(s.k==='box'){boxSel(s);return}
if(s.k==='line'){const e2=near(w.x,w.y),x=e2?e2.x:gs(w.x),y=e2?e2.y:gs(w.y);if(Math.hypot(x-s.x,y-s.y)<1)return;
snap();const a=s.s||addP(s.x,s.y),b=e2||addP(x,y);addB(a,b);sel={t:'bar',o:bars[bars.length-1]};props()}
else if(s.k==='circ'){const r=Math.hypot(w.x-s.x,w.y-s.y);if(r<1)return;snap();const c=s.s||addP(s.x,s.y);circs.push({c,r:Math.round(r*10)/10});sel={t:'circ',o:circs[circs.length-1]};props()}
else if(s.k==='rect'){const x=gs(w.x),y=gs(w.y);if(Math.abs(x-s.x)<1||Math.abs(y-s.y)<1)return;
snap();addK([addP(s.x,s.y),addP(x,s.y),addP(x,y),addP(s.x,y)]);sel={t:'blk',o:blks[blks.length-1]};props()}};
cv.ondblclick=()=>{if(tool==='poly')endPoly()};
cv.oncontextmenu=e=>e.preventDefault();
function endPoly(){if(poly.length>=3){snap();poly.forEach(p=>{if(p.n){delete p.n;p.nm=nxt(pts);pts.push(p)}});addK(poly);sel={t:'blk',o:blks[blks.length-1]}}poly=[];setTool('sel');props()}
cv.onwheel=e=>{e.preventDefault();const w=W(e),f=Math.pow(1.1,-Math.sign(e.deltaY));Z=Math.max(1,Math.min(40,Z*f));ox=e.offsetX-w.x*Z;oy=e.offsetY+w.y*Z};
function setTool(t){tool=t;poly=[];document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if((e.ctrlKey||e.metaKey)&&!e.altKey){const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}if(k==='y'){e.preventDefault();redo();return}}if(e.key==='Delete'||e.key==='Backspace')del();if(e.key==='Escape'){poly=[];sels=[];sel=null;props();setTool('sel')}if(e.key==='Enter'&&tool==='poly')endPoly()});
const IC={play:'<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="21"/><path d="M17 12l16 10-16 10z"/></svg>',pause:'<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="21"/><rect x="14" y="12" width="6" height="20" rx="1.5"/><rect x="24" y="12" width="6" height="20" rx="1.5"/></svg>',stop:'<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="21"/><rect x="14" y="14" width="16" height="16" rx="2.5"/></svg>',rec:'<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="21"/><circle cx="22" cy="22" r="8" style="fill:#e5484d"/></svg>'};
function clr(){pts.forEach(p=>{if(p.trail)p.trail=[]})}
function pIcon(){$('pl').innerHTML=play?IC.pause:IC.play;$('pl').title=play?'Pause':'Play'}
function rIcon(){$('rc').innerHTML=rec?IC.stop:IC.rec;$('rc').title=rec?'Stop and save':'Record video'}
$('pl').onclick=()=>{play=!play;pIcon()};pIcon();
$('ex').onclick=()=>{snap();example()};$('cl').onclick=()=>{snap();pts=[];bars=[];circs=[];blks=[];sel=null;sels=[];props()};
$('bgf').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>bg=i;i.src=URL.createObjectURL(f)};
function props(){const P=$('pp'),s=sel,n=(l,id,v)=>`<label>${l}<input type="number" step="any" id="${id}" value="${(+v).toFixed(2)}"></label>`,ck=(l,id,v)=>`<label>${l}<input type="checkbox" id="${id}"${v?' checked':''}></label>`,del='<button onclick="del()" style="margin-top:6px">Delete</button>';
if(sels.length){const np=gpts();P.innerHTML=`<h3>${sels.length} selected</h3><p>${np.length} points. Drag any selected part to move them together, or press Delete.</p>${sels.length===2&&sels.every(s=>s.t==='bar')?'<p id="a2"></p><button onclick="pinA(0)">Pin angle on canvas</button> ':''}${ck('Fix all points','mf',np.every(p=>p.f))}${del}`;return}
if(!s){P.innerHTML='<h3>Properties</h3><p>Pick a tool, drag on the canvas to draw, then click a shape here to edit it.</p><p>Tips: start a line on an existing point to join them. Angles: select one line and pin its angle to horizontal, or Ctrl-click two lines that share a point and pin the angle between them. <button onclick="snap();angs=[]">Clear angle markers</button> Drag across empty space to select several parts, or hold Ctrl and click parts to add or remove them. Hold the right or middle mouse button and drag to pan. Scroll to zoom.</p>';return}
const o=s.o;
if(s.t==='pt')P.innerHTML=`<h3>Point</h3><label>Name<input type="text" id="pn" value="${o.nm||''}" style="width:90px"></label>${n('x','px',o.x)}${n('y','py',o.y)}${ck('Fixed','pf',o.f)}${ck('Trace path','ptr',o.tr)}<button onclick="clr()">Clear trace</button>${del}`;
else if(s.t==='bar')P.innerHTML=`<h3>Line</h3><label>Name<input type="text" id="bn" value="${o.nm||''}" style="width:90px"></label>${n('Length','bl',o.L)}<p id="live"></p><button onclick="pinA(1)">Pin angle to horizontal</button>${ck('Motor','bm',o.mo)}${n('Speed °/s','bw',o.w)}<p id="hint">Motor: fix one end point, then tick Motor.</p>${del}`;
else if(s.t==='circ')P.innerHTML=`<h3>Circle</h3>${n('Radius','br',o.r)}<p>Centre is a point. Select it to move or fix it.</p>${del}`;
